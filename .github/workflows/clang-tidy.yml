name: clang-tidy

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-tidy nlohmann-json3-dev
      - name: Analyze dependency-light core translation unit
        run: |
          clang-tidy src/agent/skills/skill.cpp --             -std=c++20 -Isrc/agent/skills
